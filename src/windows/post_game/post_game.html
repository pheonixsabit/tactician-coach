<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactician Coach - Post Game Analysis</title>
  <link rel="stylesheet" href="../../style.css">
</head>
<body class="bg-tft-bg text-gray-100 font-sans select-none overflow-hidden h-screen p-3 flex flex-col justify-between">
  <!-- Draggable Header -->
  <div id="dragHeader" class="flex items-center justify-between pb-2 border-b border-tft-border cursor-move">
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-tft-gold animate-pulse"></span>
      <span class="font-bold text-sm tracking-wider text-tft-gold uppercase">Tactician Coach</span>
    </div>
    <div class="flex items-center space-x-2">
      <button id="closeBtn" class="text-gray-400 hover:text-white px-2 py-0.5 rounded hover:bg-gray-800 transition">✕</button>
    </div>
  </div>

  <!-- Main Content Card -->
  <div class="flex-1 flex flex-col justify-center space-y-3 py-2">
    <!-- Top Bar: Placement & Grade -->
    <div class="flex items-center justify-between bg-tft-card p-3 rounded-lg border border-tft-border">
      <div>
        <div id="placementBanner" class="text-2xl font-black text-white">#1 Place</div>
        <div id="compNameBanner" class="text-xs text-gray-400">Rebel Fast-8 (92% Match)</div>
      </div>
      <div id="gradeBadge" class="w-12 h-12 rounded-lg bg-indigo-600 flex items-center justify-center text-2xl font-black text-white shadow-lg">
        S
      </div>
    </div>

    <!-- Quick Insights: Strengths & Blunders -->
    <div class="bg-tft-card p-3 rounded-lg border border-tft-border space-y-2 text-xs">
      <div>
        <div class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider mb-1">🟢 Key Strengths</div>
        <div id="strengthsList" class="space-y-1 text-gray-300">
          <!-- Injected via JS -->
        </div>
      </div>
      <div class="pt-1 border-t border-gray-800">
        <div class="text-[11px] font-bold text-rose-400 uppercase tracking-wider mb-1">🔴 Critical Blunders</div>
        <div id="blundersList" class="space-y-1 text-gray-300">
          <!-- Injected via JS -->
        </div>
      </div>
    </div>

    <!-- Next Game Tip -->
    <div class="bg-indigo-950/40 border border-indigo-800/60 p-2.5 rounded-lg text-xs">
      <span class="font-bold text-indigo-300">💡 Coach Tip: </span>
      <span id="coachTipText" class="text-indigo-200">Commit to an all-in roll down on stage 4-1 if dropping below 35 HP.</span>
    </div>
  </div>

  <!-- Bottom Action Bar -->
  <div class="pt-2 border-t border-tft-border flex justify-between items-center">
    <div class="text-[10px] text-gray-500">Press Alt+T to toggle</div>
    <button id="expandBtn" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black font-bold text-xs px-4 py-1.5 rounded shadow transition flex items-center space-x-1">
      <span>Expand Full Report</span>
      <span>→</span>
    </button>
  </div>

  <script type="module" src="./post_game.ts"></script>
</body>
</html>
